<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 620" width="580" height="620" fill="none">
  <defs>
    <filter id="particleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="sparkleGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#c7d2fe" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sparkleGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#fbcfe8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g filter="url(#particleGlow)">
    <!-- Floating Light Sparkles and Orbs -->
    <circle class="effix-sparkle sp-1" cx="240" cy="190" r="4.5" fill="url(#sparkleGrad1)" />
    <circle class="effix-sparkle sp-2" cx="370" cy="140" r="6" fill="url(#sparkleGrad2)" />
    <circle class="effix-sparkle sp-3" cx="480" cy="230" r="5" fill="url(#sparkleGrad1)" />
    <circle class="effix-sparkle sp-4" cx="330" cy="310" r="3.5" fill="url(#sparkleGrad2)" />
    <circle class="effix-sparkle sp-5" cx="440" cy="380" r="5.5" fill="url(#sparkleGrad1)" />
    <circle class="effix-sparkle sp-6" cx="510" cy="460" r="4" fill="url(#sparkleGrad2)" />
    <circle class="effix-sparkle sp-7" cx="190" cy="260" r="3" fill="url(#sparkleGrad1)" />
    <circle class="effix-sparkle sp-8" cx="410" cy="490" r="4.5" fill="url(#sparkleGrad1)" />
    <circle class="effix-sparkle sp-9" cx="280" cy="420" r="3" fill="url(#sparkleGrad2)" />

    <!-- 4-Point Star Glints -->
    <path class="effix-glint gl-1" d="M 370 134 L 372 139 L 377 140 L 372 141 L 370 146 L 368 141 L 363 140 L 368 139 Z" fill="#ffffff" />
    <path class="effix-glint gl-2" d="M 480 225 L 481.5 229 L 485.5 230 L 481.5 231 L 480 235 L 478.5 231 L 474.5 230 L 478.5 229 Z" fill="#ffffff" />
    <path class="effix-glint gl-3" d="M 440 375 L 441.5 379 L 445.5 380 L 441.5 381 L 440 385 L 438.5 381 L 434.5 380 L 438.5 379 Z" fill="#ffffff" />
  </g>
</svg>
