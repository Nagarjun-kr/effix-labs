<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 300" width="350" height="300" fill="none">
  <defs>
    <linearGradient id="uiGlowTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="searchSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#c7d2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <filter id="topGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Search Bar Highlight Sweep -->
  <g filter="url(#topGlowFilter)">
    <!-- Active search pill outline glow -->
    <rect x="28" y="32" width="294" height="42" rx="21" stroke="url(#uiGlowTop)" stroke-width="2" stroke-opacity="0.8" fill="rgba(99, 102, 241, 0.08)" />
    
    <!-- Moving highlight streak inside search input -->
    <rect class="ui-highlight-sweep" x="100" y="48" width="70" height="8" rx="4" fill="url(#searchSweep)" />
    
    <!-- Storefront Card Glowing Badge Highlight -->
    <rect x="36" y="94" width="78" height="74" rx="14" stroke="url(#uiGlowTop)" stroke-width="2" fill="rgba(168, 85, 247, 0.12)" />

    <!-- Result Row 1 Animated Glow Line -->
    <rect class="ui-pulse-line1" x="128" y="105" width="160" height="9" rx="4.5" fill="#a5b4fc" opacity="0.85" />
    <rect class="ui-pulse-line2" x="128" y="125" width="120" height="7" rx="3.5" fill="#818cf8" opacity="0.65" />
    <rect class="ui-pulse-line3" x="128" y="142" width="90" height="6" rx="3" fill="#6366f1" opacity="0.5" />

    <!-- Rating Star Highlight -->
    <path d="M 46 200 L 48.5 207 L 56 207 L 50 211.5 L 52.5 218.5 L 46 214 L 39.5 218.5 L 42 211.5 L 36 207 L 43.5 207 Z" 
          fill="#fbbf24" filter="drop-shadow(0 0 6px rgba(251, 191, 36, 0.8))" />

    <!-- Result Row 2 & 3 Lines -->
    <rect x="70" y="206" width="230" height="7" rx="3.5" fill="#818cf8" opacity="0.7" />
    <rect x="70" y="248" width="180" height="6.5" rx="3.25" fill="#6366f1" opacity="0.6" />
  </g>
</svg>
