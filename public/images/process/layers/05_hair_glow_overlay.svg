<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 620" width="580" height="620" fill="none">
  <defs>
    <!-- Additive Glow Gradients -->
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#d946ef" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Flowing Additive Glow Cloud Tracing Hair Volume -->
  <g filter="url(#superGlow)" opacity="0.85">
    <!-- Wide Ribbon Paths that create the ethereal neon aura -->
    <path d="M 186 96 C 220 72, 272 68, 324 82 C 368 94, 408 122, 428 152" 
          stroke="url(#glowGrad1)" stroke-width="28" stroke-linecap="round" />

    <path d="M 292 148 C 342 165, 412 205, 452 258 C 484 300, 488 352, 464 394 C 445 428, 432 462, 434 496" 
          stroke="url(#glowGrad1)" stroke-width="38" stroke-linecap="round" />

    <path d="M 386 138 C 446 172, 508 222, 538 282 C 556 324, 554 372, 532 414 C 516 444, 508 472, 514 502" 
          stroke="url(#glowGrad1)" stroke-width="32" stroke-linecap="round" />

    <path d="M 464 394 C 488 438, 516 480, 532 525 C 538 544, 536 558, 526 572" 
          stroke="url(#glowGrad1)" stroke-width="24" stroke-linecap="round" />
  </g>
</svg>
