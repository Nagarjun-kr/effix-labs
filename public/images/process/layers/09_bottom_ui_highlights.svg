<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 270" width="350" height="270" fill="none">
  <defs>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="barGlowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="1" />
    </linearGradient>

    <filter id="bottomGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#bottomGlowFilter)">
    <!-- Ascending Analytics Bar Chart (Highlighted Columns) -->
    <rect class="bar-col col-1" x="95" y="132" width="16" height="28" rx="4" fill="url(#barGlowGrad)" />
    <rect class="bar-col col-2" x="120" y="122" width="16" height="38" rx="4" fill="url(#barGlowGrad)" />
    <rect class="bar-col col-3" x="145" y="110" width="16" height="50" rx="4" fill="url(#barGlowGrad)" />
    <rect class="bar-col col-4" x="170" y="96" width="16" height="64" rx="4" fill="url(#barGlowGrad)" />
    <rect class="bar-col col-5" x="195" y="80" width="16" height="80" rx="4" fill="url(#barGlowGrad)" />
    <rect class="bar-col col-6" x="220" y="60" width="16" height="100" rx="4" fill="url(#barGlowGrad)" />
    <rect class="bar-col col-7" x="245" y="44" width="16" height="116" rx="4" fill="url(#barGlowGrad)" />

    <!-- Smooth Rising Growth Curve -->
    <path class="analytics-rising-curve" 
          d="M 68 128 Q 130 120, 175 92 T 260 48" 
          stroke="url(#curveGrad)" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Upward Arrow Tip -->
    <path d="M 252 42 L 265 44 L 262 57 Z" fill="#38bdf8" />

    <!-- Search Icon Highlight -->
    <circle cx="102" cy="186" r="10" stroke="#818cf8" stroke-width="1.8" fill="rgba(99, 102, 241, 0.15)" />
    <line x1="109" y1="193" x2="116" y2="200" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />

    <!-- Location Pin Highlight -->
    <circle cx="102" cy="224" r="10" stroke="#a855f7" stroke-width="1.8" fill="rgba(168, 85, 247, 0.15)" />
    <circle cx="102" cy="222" r="3.5" fill="#c084fc" />

    <!-- Muted metric text lines -->
    <rect x="128" y="182" width="140" height="7" rx="3.5" fill="#818cf8" opacity="0.6" />
    <rect x="128" y="220" width="110" height="7" rx="3.5" fill="#a855f7" opacity="0.6" />
  </g>
</svg>
