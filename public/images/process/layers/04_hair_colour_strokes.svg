<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 620" width="580" height="620" fill="none">
  <defs>
    <!-- Neon Hair Gradients -->
    <linearGradient id="gradFringe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="gradCrown" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="40%" stop-color="#ec4899" />
      <stop offset="80%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="gradCrownInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="gradCascadeMain" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="35%" stop-color="#d946ef" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="gradOuterWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="30%" stop-color="#f43f5e" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="gradTipsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="hairNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softDiffuse" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="softBlur" />
      <feMerge>
        <feMergeNode in="softBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hair Colour Strokes Following Exact Natural Silhouettes -->
  <g class="hair-stroke-group" filter="url(#hairNeonGlow)">
    
    <!-- 1. Fringe / Forehead Sweep -->
    <path d="M 182 108 C 160 120, 142 135, 140 156 C 138 172, 148 186, 160 196" 
          stroke="url(#gradFringe)" stroke-width="5.5" stroke-linecap="round" fill="none" />

    <!-- 2. Crown Top Arch -->
    <path d="M 186 96 C 220 72, 272 68, 324 82 C 368 94, 408 122, 428 152" 
          stroke="url(#gradCrown)" stroke-width="6.5" stroke-linecap="round" fill="none" />

    <!-- 3. Crown Crest Inner Wave -->
    <path d="M 212 108 C 255 92, 312 105, 362 132 C 402 154, 432 188, 442 222" 
          stroke="url(#gradCrownInner)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- 4. Side Tendril Framing Ear -->
    <path d="M 224 135 C 228 175, 238 215, 246 255 C 252 290, 258 322, 268 348" 
          stroke="url(#gradFringe)" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- 5. Main Waterfall Cascade Wave -->
    <path class="hair-wave-mid" d="M 292 148 C 342 165, 412 205, 452 258 C 484 300, 488 352, 464 394 C 445 428, 432 462, 434 496" 
          stroke="url(#gradCascadeMain)" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- 6. Inner Ribbon Cascade -->
    <path class="hair-wave-mid" d="M 322 176 C 372 212, 425 264, 448 324 C 462 360, 454 402, 436 438 C 420 472, 412 506, 418 534" 
          stroke="url(#gradCrownInner)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- 7. Outer Voluminous Silhouette Wave -->
    <path class="hair-wave-outer" d="M 386 138 C 446 172, 508 222, 538 282 C 556 324, 554 372, 532 414 C 516 444, 508 472, 514 502" 
          stroke="url(#gradOuterWave)" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- 8. Hair Tips & Floating Ends -->
    <g class="hair-tips-group">
      <!-- Tip 1 (Outer swooping curl) -->
      <path d="M 514 502 C 525 528, 546 548, 560 564" 
            stroke="url(#gradTipsCyan)" stroke-width="6" stroke-linecap="round" fill="none" />

      <!-- Tip 2 (Mid wavy end) -->
      <path d="M 464 394 C 488 438, 516 480, 532 525 C 538 544, 536 558, 526 572" 
            stroke="url(#gradCrown)" stroke-width="5.5" stroke-linecap="round" fill="none" />

      <!-- Tip 3 (Inner trailing curl) -->
      <path d="M 434 496 C 444 528, 462 556, 482 576" 
            stroke="url(#gradFringe)" stroke-width="5" stroke-linecap="round" fill="none" />

      <!-- Tip 4 (Lowest tip under arm) -->
      <path d="M 418 534 C 426 558, 442 578, 458 592" 
            stroke="url(#gradTipsCyan)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    </g>

  </g>
</svg>
